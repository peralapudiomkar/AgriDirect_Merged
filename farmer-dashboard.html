<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Farmer Dashboard | AgriDirect</title><style>
:root{--g:#075b38;--g2:#0b7a4a;--bg:#f4faf6;--card:#fff;--ink:#18382b;--muted:#718078;--line:#dfece4;--soft:#eaf7ef;--danger:#b42318;--gold:#c68b17}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.side{width:260px;background:linear-gradient(180deg,#064b2f,#08613c);color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;gap:10px;align-items:center;padding:8px 10px 22px;border-bottom:1px solid rgba(255,255,255,.12)}.brand i{font-size:30px}.brand b{font-size:20px}.brand small{display:block;opacity:.65;font-size:10px;margin-top:3px}.nav{margin-top:14px}.nav h5{font-size:10px;letter-spacing:1.5px;opacity:.55;margin:20px 10px 8px}.nav button{width:100%;border:0;background:transparent;color:#d9f1e2;text-align:left;padding:12px 10px;border-radius:13px;margin:2px 0;display:flex;gap:12px;align-items:center}.nav button:hover,.nav button.active{background:rgba(255,255,255,.13);color:#fff}.nav .ico{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.08);display:grid;place-items:center;font-size:19px;flex:none}.nav span b{display:block;font-size:13px}.nav span small{display:block;font-size:10px;opacity:.65;margin-top:3px}.main{flex:1;min-width:0}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:10}.top h2{margin:0;font-size:18px}.actions{display:flex;gap:8px}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:700;font-size:11px}.primary{background:var(--g);color:#fff}.light{background:var(--soft);color:var(--g)}.danger{background:#fff0ef;color:var(--danger)}.content{padding:26px;max-width:1250px}.hero{background:linear-gradient(120deg,#075a38,#238b58);color:#fff;border-radius:22px;padding:28px;position:relative;overflow:hidden}.hero h1{margin:5px 0 8px;font-size:30px}.hero p{margin:0;max-width:700px;color:#d7efe0;line-height:1.6;font-size:12px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-top:18px}.stat,.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:0 7px 24px rgba(18,70,43,.05)}.stat strong{display:block;font-size:24px;color:var(--g);margin-top:6px}.stat small{color:var(--muted);font-size:10px}.workspace{margin-top:22px}.workspace-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:12px}.workspace-head h2{margin:0;font-size:22px}.workspace-head p{margin:4px 0 0;color:var(--muted);font-size:11px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;font-size:10px;font-weight:700;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid #d9e6de;border-radius:10px;padding:10px;background:#fbfdfc;outline:0}.field textarea{min-height:85px;resize:vertical}.table{width:100%;border-collapse:collapse;font-size:11px}.table th,.table td{padding:11px 8px;border-bottom:1px solid #edf2ee;text-align:left}.table th{color:var(--muted);font-size:9px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.crop-card h3,.card h3{margin:0 0 7px;font-size:15px}.crop-card p,.card p{font-size:11px;color:var(--muted);line-height:1.55}.tag{display:inline-block;padding:5px 8px;border-radius:20px;background:var(--soft);color:var(--g);font-size:9px;font-weight:700}.actions-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.notice{padding:12px;border-radius:11px;background:#f5faf7;color:#456252;font-size:11px;margin-bottom:10px}.empty{padding:35px;text-align:center;color:var(--muted);border:1px dashed #cbdacf;border-radius:15px}.toast{position:fixed;right:20px;bottom:20px;background:#173127;color:#fff;padding:12px 15px;border-radius:11px;display:none;z-index:99;font-size:11px}.toast.show{display:block}.mobile-menu{display:none;border:0;background:var(--soft);border-radius:9px;padding:8px}.lang{display:flex;gap:4px}.lang button{border:0;background:#f0f5f2;padding:7px 8px;border-radius:8px;font-size:9px}.mini-map{height:360px;border-radius:14px;overflow:hidden}.pill{padding:5px 9px;border-radius:20px;background:#f2f6f3;font-size:9px}.scheme{border-left:4px solid var(--g)}@media(max-width:1050px){.side{width:225px}.grid4{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.side{position:fixed;left:-270px;z-index:30;transition:.2s}.side.open{left:0}.mobile-menu{display:block}.top{padding:0 14px}.content{padding:15px}.formgrid,.cards{grid-template-columns:1fr}.grid4{grid-template-columns:1fr 1fr}.top .lang{display:none}}
</style></head><body><div class="app">
<aside class="side" id="side"><div class="brand"><i>🌱</i><div><b>AgriDirect</b><small>Farmer Workspace</small></div></div><nav class="nav"><h5>FARMER</h5>
<button onclick="openPage('dashboard',this)"><div class="ico">🏠</div><span><b>Dashboard</b><small>సారాంశం</small></span></button>
<button onclick="openPage('sell',this)"><div class="ico">🌾</div><span><b>Sell My Crop</b><small>నా పంటను అమ్మండి</small></span></button>
<button onclick="openPage('crops',this)"><div class="ico">🌱</div><span><b>My Crops</b><small>నా పంటలు</small></span></button>
<button onclick="openPage('requests',this)"><div class="ico">🤝</div><span><b>Buyer Requests</b><small>కొనుగోలుదారుల అభ్యర్థనలు</small></span></button>
<button onclick="openPage('orders',this)"><div class="ico">📦</div><span><b>Orders</b><small>ఆర్డర్లు</small></span></button>
<button onclick="openPage('earnings',this)"><div class="ico">💰</div><span><b>My Earnings</b><small>నా ఆదాయం</small></span></button>
<h5>FARMER COMMUNITY</h5>
<button onclick="openPage('suggestions',this)"><div class="ico">💬</div><span><b>Farmer Suggestions</b><small>రైతుల సలహాలు</small></span></button>
<button onclick="openPage('schemes',this)"><div class="ico">🏛️</div><span><b>Govt Schemes</b><small>ప్రభుత్వ పథకాలు</small></span></button>
<button onclick="openPage('modern',this)"><div class="ico">🚜</div><span><b>Modern Agriculture</b><small>ఆధునిక వ్యవసాయం</small></span></button>
<button onclick="openPage('advisor',this)"><div class="ico">🤖</div><span><b>Smart Crop Advisor</b><small>AI పంట సలహా</small></span></button>
<button onclick="openPage('market',this)"><div class="ico">📈</div><span><b>AI Market Prices</b><small>మార్కెట్ ధరలు</small></span></button>
<button onclick="openPage('weather',this)"><div class="ico">🌦️</div><span><b>Weather Planning</b><small>వాతావరణం</small></span></button>
<button onclick="location.href='{{ url_for('pesticides') }}'"><div class="ico">🧪</div><span><b>Pesticide Knowledge</b><small>పురుగుమందులు</small></span></button>
<button onclick="openPage('profile',this)"><div class="ico">👤</div><span><b>My Profile</b><small>నా ప్రొఫైల్</small></span></button>
<button onclick="openPage('notifications',this)"><div class="ico">🔔</div><span><b>Notifications</b><small>సూచనలు</small></span></button>
<button onclick="location.href='{{ url_for('logout') }}'"><div class="ico">↪️</div><span><b>Logout</b><small>నిష్క్రమించండి</small></span></button>
</nav></aside>
<main class="main"><header class="top"><div class="actions"><button class="mobile-menu" onclick="document.getElementById('side').classList.toggle('open')">☰</button><h2 id="pageTitle">Farmer Dashboard</h2></div><div class="actions"><div class="lang"><button onclick="setLang('en')">EN</button><button onclick="setLang('te')">తెలుగు</button><button onclick="setLang('hi')">हिन्दी</button></div><button class="btn light" onclick="openPage('notifications')">🔔</button><button class="btn danger" onclick="location.href='{{ url_for('logout') }}'">Logout</button></div></header>
<div class="content"><section class="hero"><small>FARMER WORKSPACE</small><h1>Welcome, {{ farmer_name }} 👋</h1><p>Manage crops, buyer requests, orders, earnings, market information and farmer services from one dynamic page.</p></section><section class="grid4"><div class="stat">🌾<strong id="sCrops">0</strong><small>My Crops</small></div><div class="stat">📦<strong id="sOrders">0</strong><small>Orders</small></div><div class="stat">🚚<strong id="sActive">0</strong><small>Active Deliveries</small></div><div class="stat">💰<strong id="sEarn">₹0</strong><small>Delivered Value</small></div></section><div id="workspace" class="workspace"></div></div></main></div><div class="toast" id="toast"></div>
<script>
const pageNames={dashboard:'Farmer Dashboard',sell:'Sell My Crop',crops:'My Crops',requests:'Buyer Requests',orders:'Orders',earnings:'My Earnings',suggestions:'Farmer Suggestions',schemes:'Government Schemes',modern:'Modern Agriculture',advisor:'Smart Crop Advisor',market:'AI Market Prices',weather:'Weather Planning',profile:'My Profile',notifications:'Notifications'};let current='dashboard',allCrops=[],allOrders=[],allSuggestions=[];
const $=id=>document.getElementById(id); function toast(m){$('toast').textContent=m;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2400)}
async function api(url,opt={}){const r=await fetch(url,opt);const d=await r.json();if(!r.ok||d.ok===false)throw Error(d.error||'Request failed');return d}
function openPage(p,btn){current=p;$('pageTitle').textContent=pageNames[p]||'Farmer Dashboard';document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');render(p);if(innerWidth<760)$('side').classList.remove('open')}
async function loadData(){try{const [c,o,s,summary]=await Promise.all([api('/api/crops'),api('/api/orders'),api('/api/suggestions'),api('/api/dashboard-summary')]);allCrops=c.crops;allOrders=o.orders;allSuggestions=s.suggestions;$('sCrops').textContent=summary.crops;$('sOrders').textContent=summary.orders;$('sActive').textContent=summary.active;$('sEarn').textContent='₹'+Number(summary.earnings||0).toLocaleString('en-IN');render(current)}catch(e){toast(e.message)}}
function render(p){const w=$('workspace');const base='<div class="workspace-head"><div><h2>'+pageNames[p]+'</h2><p>Use this section without leaving the dashboard.</p></div></div>';let html=base;
if(p==='dashboard')html+=`<div class="cards"><div class="card"><h3>🌾 Sell directly</h3><p>Add a crop listing with quantity, price, location and harvest date. Buyers can immediately see it.</p><div class="actions-row"><button class="btn primary" onclick="openPage('sell')">Add Crop</button></div></div><div class="card"><h3>📦 Manage Orders</h3><p>See buyer orders and open the working live tracking page for delivery orders.</p><div class="actions-row"><button class="btn light" onclick="openPage('orders')">View Orders</button></div></div><div class="card"><h3>🤖 Get Advice</h3><p>Choose a crop and receive a simple rule-based crop recommendation.</p><div class="actions-row"><button class="btn light" onclick="openPage('advisor')">Open Advisor</button></div></div></div>`;
if(p==='sell')html+=`<div class="panel"><form onsubmit="addCrop(event)"><div class="formgrid"><div class="field"><label>Crop name</label><input id="fCrop" required placeholder="Tomato"></div><div class="field"><label>Variety</label><input id="fVariety" placeholder="Local Red"></div><div class="field"><label>Quantity (kg)</label><input id="fQty" type="number" min="1" required></div><div class="field"><label>Price per kg (₹)</label><input id="fPrice" type="number" min="0" required></div><div class="field"><label>Location</label><input id="fLoc" required placeholder="Guntur"></div><div class="field"><label>Harvest date</label><input id="fDate" type="date"></div><div class="field"><label>Availability</label><select id="fAvail"><option>high</option><option>medium</option><option>low</option></select></div><div class="field"><label>Crop emoji</label><input id="fEmoji" value="🌾"></div><div class="field" style="grid-column:1/-1"><label>Description</label><textarea id="fDesc" placeholder="Describe quality, packing, pickup information..."></textarea></div></div><div class="actions-row"><button class="btn primary">Publish Crop</button><button type="button" class="btn light" onclick="openPage('crops')">My Crops</button></div></form></div>`;
if(p==='crops')html+=`<div class="cards">${allCrops.length?allCrops.map(c=>`<div class="crop-card card"><div style="font-size:30px">${c.emoji||'🌾'}</div><h3>${esc(c.crop)} ${c.variety?'— '+esc(c.variety):''}</h3><span class="tag">${esc(c.availability||'available')}</span><p>${esc(c.description||'No description')}</p><p><b>${c.quantity} ${esc(c.unit||'kg')}</b> available<br><b>₹${c.price}</b> / kg<br>${esc(c.location||'')}</p><div class="actions-row"><button class="btn danger" onclick="deleteCrop('${c.id}')">Remove</button></div></div>`).join(''):'<div class="empty">No crops yet. Use Sell My Crop to publish your first listing.</div>'}</div>`;
if(p==='requests')html+=`<div class="panel"><div class="notice">Buyer requests are represented by your orders. New requests appear here as soon as a buyer places an order.</div>${orderRows('Requested')}</div>`;
if(p==='orders')html+=`<div class="panel">${orderRows()}</div>`;
if(p==='earnings')html+=`<div class="panel"><h3>Delivered earnings</h3><table class="table"><thead><tr><th>Order</th><th>Crop</th><th>Qty</th><th>Value</th><th>Status</th></tr></thead><tbody>${allOrders.filter(o=>o.status==='Delivered').map(o=>`<tr><td>${o.id}</td><td>${esc(o.crop)}</td><td>${o.quantity} kg</td><td>₹${(o.quantity*o.price).toLocaleString('en-IN')}</td><td><span class="tag">Delivered</span></td></tr>`).join('')||'<tr><td colspan="5">No delivered orders yet.</td></tr>'}</tbody></table></div>`;
if(p==='suggestions')html+=`<div class="panel"><form onsubmit="postSuggestion(event)"><div class="formgrid"><div class="field"><label>Title</label><input id="sgTitle" required></div><div class="field"><label>Category</label><select id="sgCat"><option>general</option><option>rice</option><option>chilli</option><option>vegetables</option></select></div><div class="field" style="grid-column:1/-1"><label>Your suggestion</label><textarea id="sgText" required></textarea></div></div><button class="btn primary">Post Suggestion</button></form></div><div class="cards" style="margin-top:14px">${allSuggestions.map(s=>`<div class="card"><span class="tag">${esc(s.category)}</span><h3>${esc(s.title)}</h3><p>${esc(s.text)}</p><small>By ${esc(s.author)} · ${s.likes||0} likes</small><div class="actions-row"><button class="btn light" onclick="likeSuggestion('${s.id}')">👍 Like</button></div></div>`).join('')}</div>`;
if(p==='schemes')html+=`<div class="cards">${[['PM-KISAN','Income support for eligible farmer families.','https://pmkisan.gov.in/'],['PMFBY','Crop insurance support against eligible risks.','https://pmfby.gov.in/'],['Soil Health Card','Soil testing and nutrient recommendations.','https://soilhealth.dac.gov.in/'],['PM-KUSUM','Solar energy support for eligible agriculture uses.','https://pmkusum.mnre.gov.in/']].map(x=>`<div class="card scheme"><h3>🏛️ ${x[0]}</h3><p>${x[1]}</p><div class="actions-row"><button class="btn primary" onclick="window.open('${x[2]}','_blank','noopener')">Official Portal</button></div></div>`).join('')}</div>`;
if(p==='modern')html+=`<div class="cards">${[['💧','Drip Irrigation','Deliver water near roots and reduce unnecessary water loss.'],['🛰️','Precision Farming','Use field observations and maps to plan inputs and crop zones.'],['🌱','Protected Cultivation','Use shade nets, mulching and suitable protected structures for high-value crops.'],['📦','Better Packing','Grade produce, use clean crates and label quantity before dispatch.'],['🤖','Farm Records','Record crop, input, harvest and sales data to improve future decisions.'],['♻️','Soil-Friendly Farming','Use crop rotation, organic matter and balanced nutrient application.']].map(x=>`<div class="card"><div style="font-size:28px">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join('')}</div>`;
if(p==='advisor')html+=`<div class="panel"><div class="formgrid"><div class="field"><label>Crop</label><select id="adCrop"><option>Rice</option><option>Chilli</option><option>Tomato</option><option>Groundnut</option><option>Cotton</option></select></div><div class="field"><label>Water availability</label><select id="adWater"><option>Good</option><option>Medium</option><option>Low</option></select></div><div class="field"><label>Soil</label><select id="adSoil"><option>Loamy</option><option>Black</option><option>Red</option><option>Sandy</option></select></div></div><div class="actions-row"><button class="btn primary" onclick="getAdvice()">Generate Advice</button></div><div id="advice" class="notice" style="margin-top:15px">Choose inputs and generate a simple crop-care plan.</div></div>`;
if(p==='market')html+=`<div class="panel"><div class="actions-row" style="margin-top:0"><button class="btn primary" onclick="refreshPrices()">↻ Refresh Prices</button></div><div class="cards" id="prices" style="margin-top:14px"></div></div>`;
if(p==='weather')html+=`<div class="panel"><div class="formgrid"><div class="field"><label>District / location</label><input id="weatherLoc" value="Guntur"></div><div class="field"><label>Crop stage</label><select id="weatherStage"><option>Seedling</option><option>Vegetative</option><option>Flowering</option><option>Harvest</option></select></div></div><div class="actions-row"><button class="btn primary" onclick="planWeather()">Create Plan</button></div><div id="weatherOut" class="notice" style="margin-top:15px">Enter your location and stage for a practical planning checklist.</div></div>`;
if(p==='profile')html+=`<div class="panel"><div class="formgrid"><div class="field"><label>Name</label><input id="pfName"></div><div class="field"><label>Email</label><input id="pfEmail" disabled></div></div><div class="actions-row"><button class="btn primary" onclick="saveProfile()">Save Profile</button></div></div>`;
if(p==='notifications')html+=`<div id="notices" class="panel">Loading notifications...</div>`;
w.innerHTML=html;if(p==='market')refreshPrices();if(p==='profile')loadProfile();if(p==='notifications')loadNotifications()}
function orderRows(filter){const a=filter?allOrders.filter(o=>o.status===filter):allOrders;return a.length?a.map(o=>`<div class="card" style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;gap:10px"><b>${o.id} · ${esc(o.crop)}</b><span class="tag">${esc(o.status)}</span></div><p>${o.quantity} kg · ₹${o.price}/kg · Buyer: ${esc(o.buyer_name||'Buyer')} · Transporter: ${esc(o.transporter_name||'Assigned')}</p><p>${esc(o.last_event||'')}</p><div class="actions-row"><button class="btn primary" onclick="location.href='/order-tracking/${encodeURIComponent(o.id)}'">📍 Track</button></div></div>`).join(''):'<div class="empty">No matching orders.</div>'}
async function addCrop(e){e.preventDefault();try{await api('/api/crops',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({crop:$('fCrop').value,variety:$('fVariety').value,quantity:$('fQty').value,price:$('fPrice').value,location:$('fLoc').value,harvest_date:$('fDate').value,availability:$('fAvail').value,emoji:$('fEmoji').value,description:$('fDesc').value})});toast('Crop published successfully');await loadData();openPage('crops')}catch(e){toast(e.message)}}
async function deleteCrop(id){if(!confirm('Remove this crop listing?'))return;try{await api('/api/crops/'+id,{method:'DELETE'});toast('Crop removed');await loadData()}catch(e){toast(e.message)}}
async function postSuggestion(e){e.preventDefault();try{await api('/api/suggestions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:$('sgTitle').value,category:$('sgCat').value,text:$('sgText').value})});toast('Suggestion posted');await loadData()}catch(e){toast(e.message)}}
async function likeSuggestion(id){try{await api('/api/suggestions/'+id+'/like',{method:'POST'});await loadData()}catch(e){toast(e.message)}}
function getAdvice(){const c=$('adCrop').value,w=$('adWater').value,s=$('adSoil').value;let a=`For ${c} on ${s} soil with ${w.toLowerCase()} water availability: use balanced nutrients, monitor pests twice a week, maintain field hygiene and record irrigation. `;if(w==='Low')a+='Prefer moisture-saving practices such as mulching/drip irrigation where suitable.';if(w==='Good')a+='Avoid unnecessary over-irrigation and check drainage after heavy rain.';$('advice').textContent=a}
function refreshPrices(){const base={Rice:48,Chilli:145,Tomato:32,Groundnut:76,Cotton:72};const el=$('prices');if(!el)return;el.innerHTML=Object.entries(base).map(([k,v])=>{const live=Math.round(v*(.92+Math.random()*.16));return `<div class="card"><h3>${k}</h3><p>Indicative farmer-market price</p><strong style="font-size:22px;color:var(--g)">₹${live}/kg</strong><p>Updated: ${new Date().toLocaleTimeString()}</p></div>`}).join('')}
function planWeather(){const l=$('weatherLoc').value||'your area',st=$('weatherStage').value;$('weatherOut').textContent=`${l} · ${st}: check rainfall before irrigation, keep harvested produce covered, inspect for disease after humid weather and confirm local market/transport availability before dispatch.`}
async function loadProfile(){try{const d=await api('/api/profile');$('pfName').value=d.profile.name;$('pfEmail').value=d.profile.email}catch(e){toast(e.message)}}async function saveProfile(){try{await api('/api/profile',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('pfName').value})});toast('Profile saved')}catch(e){toast(e.message)}}
async function loadNotifications(){try{const d=await api('/api/notifications');$('notices').innerHTML=d.notifications.length?d.notifications.map(n=>`<div class="notice"><b>${esc(n.title)}</b><br>${esc(n.text)}<br><small>${n.time?new Date(n.time).toLocaleString():''}</small></div>`).join(''):'<div class="empty">No notifications yet.</div>'}catch(e){$('notices').textContent=e.message}}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function setLang(l){fetch('/set-language/'+l,{method:'POST'}).then(()=>toast(l==='te'?'భాష మార్చబడింది':l==='hi'?'भाषा बदली गई':'Language selected'))}
loadData();openPage('dashboard');
</script><script src="{{ url_for('static',filename='js/language.js') }}"></script></body></html>
